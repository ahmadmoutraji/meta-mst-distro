# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mst-distro"
BBFILE_PATTERN_meta-mst-distro = "^${LAYERDIR}/"
BBFILE_PATTERN_IGNORE_EMPTY_meta-mst-distro = "1"
BBFILE_PRIORITY_meta-mst-distro = "21"
LAYERDEPENDS_meta-mst-distro = "core yocto"
LAYERSERIES_COMPAT_meta-mst-distro = "scarthgap"
